                    <div class="border-b border-slate-800 pb-3 flex flex-col md:flex-row md:items-end justify-between gap-2">

                        </div>

                    </div>
                    <div class="pt-1">${slide.html}</div>
                </div>
            `;

            document.getElementById('slide-counter').textContent = `${String(slide.id).padStart(2, '0')} / ${slidesData.length}`;
            document.getElementById('slide-jump').value = currentSlideIndex;
            document.getElementById('progress-bar').style.width = `${((currentSlideIndex + 1) / slidesData.length) * 100}%`;
            document.getElementById('notes-slide-title').textContent = `— Diapositiva ${slide.id}: ${slide.title}`;
            document.getElementById('speaker-notes-text').textContent = slide.notes;

            if (slide.id === 12) {
                setSimMode(simMode);
            }

            lucide.createIcons();
            if (window.renderMathInElement) {
                renderMathInElement(container, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });
            }
        }

        function setSimMode(mode) {
            simMode = mode;
            ['raw', 'ibot', 'uni'].forEach(m => {
                const btn = document.getElementById(`btn-mode-${m}`);
                if (!btn) return;
                if (m === mode) {
                    btn.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold border border-teal-400 bg-teal-500/25 text-teal-200';
                } else {
                    btn.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold border border-slate-700 bg-slate-900 text-slate-300 hover:border-slate-500';
                }
            });
            updateSim();
        }

        function updateSim() {
            const checkboxes = document.querySelectorAll('.sim-ds');
            if (!checkboxes.length) return;

            let totalGB = 0;
            let totalInst = 0;
            let totalBags = 0;
            let maxSingleGB = 0;

            checkboxes.forEach(cb => {
                const key = cb.dataset.key;
                const d = SIM_DATASETS[key];
                const gb = simMode === 'raw' ? d.rawGB : (simMode === 'ibot' ? d.ibotGB : d.uniGB);
                const lbl = document.getElementById(`sz-${key}`);
                if (lbl) lbl.textContent = `${gb.toFixed(2)} GB`;
                if (cb.checked) {
                    totalGB += gb;
                    totalInst += d.instances;
                    totalBags += d.bags;
                    if (gb > maxSingleGB) maxSingleGB = gb;
                }
            });

            document.getElementById('sim-total-gb').textContent = `${totalGB.toFixed(2)} GB`;
            document.getElementById('sim-instances').textContent = `${totalInst.toLocaleString('es-CL')}`;

            const speedEl = document.getElementById('sim-speed');
            const badgeEl = document.getElementById('sim-status-badge');
            const barEl = document.getElementById('sim-bar-fill');
            const pctEl = document.getElementById('sim-bar-pct');
            const recEl = document.getElementById('sim-recommendation');

            const pct = Math.min(100, (totalGB / 20.0) * 100);
            barEl.style.width = `${pct}%`;
            pctEl.textContent = `${totalGB.toFixed(1)} / 20 GB ref.`;

            if (simMode === 'raw') {
                speedEl.textContent = 'Lenta (CPU)';
                speedEl.className = 'text-lg font-extrabold text-rose-400 mono mt-1';

            } else {
                speedEl.textContent = 'Rápida (Min.)';
                speedEl.className = 'text-lg font-extrabold text-emerald-400 mono mt-1';
                barEl.className = 'h-full bg-gradient-to-r from-teal-500 to-blue-500 transition-all duration-300';
            }

            if (maxSingleGB > 10.0) {
                badgeEl.textContent = `EXCEDE 10 GB/dataset (máx ${maxSingleGB.toFixed(2)} GB)`;
                badgeEl.className = 'inline-block mt-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-rose-500/20 text-rose-300 border border-rose-500/40';
            } else {
                badgeEl.textContent = `CUMPLE < 10 GB por dataset`;
                badgeEl.className = 'inline-block mt-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40';
            }

            if (simMode === 'raw') {
                recEl.innerHTML = `<strong>Diagnóstico:</strong> En formato de imágenes/parches crudos (${totalInst.toLocaleString('es-CL')} instancias, ${totalBags.toLocaleString('es-CL')} unidades), entrenar backbones visuales en <strong>PyTorch CPU</strong> sin CUDA demoraría horas por época y supera el límite de 10 GB en NCT-CRC (15.19 GB) y CAMELYON16 (10.77 GB).`;
            } else {
                const dim = simMode === 'ibot' ? '768-d' : '1024-d';
                recEl.innerHTML = `<strong>Diagnóstico Óptimo (${simMode.toUpperCase()} ${dim}):</strong> Todo el conjunto seleccionado ocupa apenas <strong>${totalGB.toFixed(2)} GB</strong>, cumpliendo estrictamente el límite &lt;10 GB. El cabezal <strong>Gated Attention (O(K))</strong> entrena en minutos sobre hardware local.`;
            }
        }

        function openLightbox(src, caption) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox-caption').textContent = caption;
            document.getElementById('lightbox-modal').classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('lightbox-modal').classList.add('hidden');
        }

        function nextSlide() {
            if (currentSlideIndex < slidesData.length - 1) {
                currentSlideIndex++;
                renderCurrentSlide();
            }
        }

        function prevSlide() {
            if (currentSlideIndex > 0) {
                currentSlideIndex--;
                renderCurrentSlide();
            }
        }

        function goToSlide(index) {
            if (index >= 0 && index < slidesData.length) {
                currentSlideIndex = index;
                renderCurrentSlide();
            }
        }

        function toggleNotes() {
            showNotes = !showNotes;
            const drawer = document.getElementById('speaker-drawer');
            const btn = document.getElementById('btn-notes');
            if (showNotes) {
                document.body.classList.add('with-notes');
                drawer.style.transform = 'translateY(0)';
                btn.classList.replace('bg-slate-800', 'bg-teal-500/20');
            } else {
                document.body.classList.remove('with-notes');
                drawer.style.transform = 'translateY(100%)';
                btn.classList.replace('bg-teal-500/20', 'bg-slate-800');
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeLightbox();
            } else if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                nextSlide();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                prevSlide();
            }
        });

        window.addEventListener('DOMContentLoaded', initPresentation);
