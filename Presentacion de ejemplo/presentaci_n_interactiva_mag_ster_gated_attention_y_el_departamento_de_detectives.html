        // =========================================================================
        // ESTADO Y FUNCIONES DE NAVEGACIÓN
        // =========================================================================
        let currentSlideIndex = 0;
        let showNotes = true;

        function initPresentation() {
            const select = document.getElementById('slide-jump');
            select.innerHTML = slidesData.map((s, idx) => 
                `<option value="${idx}">${String(s.id).padStart(2, '0')} — ${s.title.substring(0, 52)}...</option>`
            ).join('');

            renderCurrentSlide();
            lucide.createIcons();
        }

        function renderCurrentSlide() {
            const slide = slidesData[currentSlideIndex];
            const container = document.getElementById('slide-content');

            container.innerHTML = `
                <div class="space-y-4 animate-fadeIn">
                    <!-- Cabecera de la Diapositiva -->
                    <div class="border-b border-slate-800 pb-3 flex flex-col md:flex-row md:items-end justify-between gap-2">
                        <div>
                            <div class="inline-flex items-center gap-2 text-[11px] font-mono font-bold uppercase tracking-wider text-teal-400 mb-1">
                                <span class="px-2 py-0.5 rounded bg-teal-500/15 border border-teal-500/30">DIAPOSITIVA ${String(slide.id).padStart(2, '0')} / ${slidesData.length}</span>
                                <span>${slide.badge}</span>
                            </div>
                            <h2 class="text-xl md:text-2xl font-extrabold text-white tracking-tight">${slide.title}</h2>
                        </div>
                        <p class="text-xs text-slate-400 md:text-right max-w-md">${slide.subtitle}</p>
                    </div>

                    <!-- Cuerpo de la Diapositiva -->
                    <div class="pt-1">
                        ${slide.html}
                    </div>
                </div>
            `;

            // Actualizar contadores y barra de progreso
            document.getElementById('slide-counter').textContent = `${String(slide.id).padStart(2, '0')} / ${slidesData.length}`;
            document.getElementById('slide-jump').value = currentSlideIndex;
            document.getElementById('progress-bar').style.width = `${((currentSlideIndex + 1) / slidesData.length) * 100}%`;

            // Actualizar Teleprompter / Guion
            document.getElementById('notes-slide-title').textContent = `— Diapositiva ${slide.id}: ${slide.title}`;
            document.getElementById('speaker-notes-text').textContent = slide.notes;

            // Si estamos en la Diapositiva 14, inicializar la tabla interactiva de Peras y Manzanas
            if (slide.id === 14) {
                updateFruitSimulation(4.0);
            }

            // Renderizar íconos y fórmulas LaTeX con KaTeX
            lucide.createIcons();
            if (window.renderMathInElement) {
                renderMathInElement(container, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });
            }
        }

        function nextSlide() {
            if (currentSlideIndex < slidesData.length - 1) {
                currentSlideIndex++;
                renderCurrentSlide();
            }
        }

        function prevSlide() {
            if (currentSlideIndex > 0) {
                currentSlideIndex--;
                renderCurrentSlide();
            }
        }

        function goToSlide(index) {
            if (index >= 0 && index < slidesData.length) {
                currentSlideIndex = index;
                renderCurrentSlide();
            }
        }

        function toggleNotes() {
            showNotes = !showNotes;
            const drawer = document.getElementById('speaker-drawer');
            const btn = document.getElementById('btn-notes');
            if (showNotes) {
                document.body.classList.add('with-notes');
                drawer.style.transform = 'translateY(0)';
                btn.classList.replace('bg-slate-800', 'bg-teal-500/20');
            } else {
                document.body.classList.remove('with-notes');
                drawer.style.transform = 'translateY(100%)';
                btn.classList.replace('bg-teal-500/20', 'bg-slate-800');
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen();
            }
        }

        // =========================================================================
        // SIMULADOR INTERACTIVO DE "PERAS Y MANZANAS" (DIAPOSITIVA 14)
        // =========================================================================
        function updateFruitSimulation(wValue) {
            const w = parseFloat(wValue);
            const label = document.getElementById('w-val-label');
            if (label) label.textContent = w.toFixed(1);

            const fruits = [
                { name: "🍎 k=1: Manzana Roja Sana", tanh: -0.80, sigm: 0.05, gateDesc: "Cerrada", rowClass: "" },
                { name: "🍐 k=2: Pera Sana con pecas", tanh: 0.50, sigm: 0.02, gateDesc: "Cerrada", rowClass: "bg-slate-950/40" },
                { name: "🍏 k=3: Manzana con golpe leve", tanh: 0.75, sigm: 0.04, gateDesc: "Cerrada (Falso Pos.)", rowClass: "bg-amber-950/20" },
                { name: "🍎🍄 k=4: Manzana con Hongo Real", tanh: 0.90, sigm: 0.98, gateDesc: "Abierta (Hongo Real)", rowClass: "bg-red-950/30 font-bold" }
            ];

            // Cálculo Softmax para Atención Simple (solo tanh)
            const expPlain = fruits.map(f => Math.exp(w * f.tanh));
            const sumExpPlain = expPlain.reduce((a, b) => a + b, 0);

            // Cálculo Softmax para Gated Attention (tanh * sigm)
            const expGated = fruits.map(f => Math.exp(w * (f.tanh * f.sigm)));
            const sumExpGated = expGated.reduce((a, b) => a + b, 0);

            const tbody = document.getElementById('fruit-table-body');
            if (!tbody) return;

            tbody.innerHTML = fruits.map((f, i) => {
                const hadamard = f.tanh * f.sigm;
                const aPlain = (expPlain[i] / sumExpPlain) * 100;
                const aGated = (expGated[i] / sumExpGated) * 100;

                return `
                    <tr class="${f.rowClass}">
                        <td class="p-3 font-sans font-semibold text-white">${f.name}</td>
                        <td class="p-3 text-center">${f.tanh >= 0 ? '+' : ''}${f.tanh.toFixed(2)}</td>
                        <td class="p-3 text-center">${f.sigm.toFixed(2)} <span class="text-[10px] text-slate-400 font-sans">(${f.gateDesc})</span></td>
                        <td class="p-3 text-center text-purple-300 font-bold">${hadamard >= 0 ? '+' : ''}${hadamard.toFixed(3)}</td>
                        <td class="p-3">
                            <div class="flex items-center justify-center gap-2">
                                <span class="${i === 2 ? 'text-rose-400 font-bold' : 'text-amber-200'} w-12 text-right">${aPlain.toFixed(1)}%</span>
                                <div class="w-24 h-2.5 bg-slate-800 rounded-full overflow-hidden">
                                    <div class="h-full ${i === 2 ? 'bg-rose-500' : 'bg-amber-400'}" style="width: ${Math.min(100, aPlain)}%"></div>
                                </div>
                            </div>
                        </td>
                        <td class="p-3">
                            <div class="flex items-center justify-center gap-2">
                                <span class="${i === 3 ? 'text-emerald-300 font-extrabold' : 'text-teal-200'} w-12 text-right">${aGated.toFixed(1)}%</span>
                                <div class="w-24 h-2.5 bg-slate-800 rounded-full overflow-hidden">
                                    <div class="h-full ${i === 3 ? 'bg-emerald-400' : 'bg-teal-500'}" style="width: ${Math.min(100, aGated)}%"></div>
                                </div>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Navegación por teclado
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                nextSlide();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                prevSlide();
            }
        });

        window.addEventListener('DOMContentLoaded', initPresentation);
    </script>
